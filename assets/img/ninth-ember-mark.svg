<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="t">
  <title id="t">Ninth Ember mark</title>
  <defs>
    <linearGradient id="ne-g" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#ff3d1f"/>
      <stop offset="0.55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="ne-f" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d1f"/>
      <stop offset="1" stop-color="#ffd37a"/>
    </linearGradient>
    <filter id="ne-glow" x="-30%" y="-30%" width="160%" height="160%">
