      <path transform="translate(104 26)" d="M0-6c2 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8Z"/>
      <path transform="translate(124 30) rotate(15)" d="M0-6c2 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8Z"/>
      <path transform="translate(142 40) rotate(30)" d="M0-6c2 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8Z"/>
      <path transform="translate(158 56) rotate(44)" d="M0-6c2 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8Z"/>
      <path transform="translate(170 78) rotate(58)" d="M0-6c2 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8Z"/>
